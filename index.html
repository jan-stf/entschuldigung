<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Es tut mir leid ❤️</title>
    <!-- Schrift, die auf allen Geräten gleich aussieht (iPhone hat kein Comic Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* =====================================================================
           🎨  FARBEN – hier kannst du das Farbschema ändern
           ===================================================================== */
        :root {
            --hintergrund-1: #a1c4fd;   /* Farbverlauf Hintergrund */
            --hintergrund-2: #74c0fc;
            --hintergrund-3: #89cff0;
            --hintergrund-4: #4dabf7;
            --text-farbe:    #2b8fd6;   /* Überschrift + Text unter den Buttons */
            --ja-hell:       #74c0fc;   /* JA-Button Verlauf */
            --ja-dunkel:     #339af0;
            --nein-hell:     #d0ebff;   /* NEIN-Button Verlauf */
            --nein-dunkel:   #74c0fc;
            --schatten:      rgba(77, 171, 247, 0.5);
            --schatten-leicht: rgba(77, 171, 247, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Neue', 'Comic Sans MS', 'Comic Sans', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, var(--hintergrund-1), var(--hintergrund-2), var(--hintergrund-3), var(--hintergrund-4), var(--hintergrund-3), var(--hintergrund-2));
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            overflow: hidden;
            position: relative;
        }

        /* 📱 Handy: Seite darf scrollen, falls der Inhalt höher ist als der Bildschirm */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                overflow-y: auto;
            }
            body {
                padding: 16px 0;
            }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-heart {
            position: fixed;
            font-size: 2em;
            opacity: 0.15;
            animation: floatAround 15s ease-in-out infinite;
            pointer-events: none;
            color: #fff;
        }

        @keyframes floatAround {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(100px, -100px) rotate(90deg); }
            50% { transform: translate(200px, 50px) rotate(180deg); }
            75% { transform: translate(-50px, -50px) rotate(270deg); }
        }

        .container {
            text-align: center;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 35px;
            box-shadow: 0 25px 70px var(--schatten);
            max-width: 650px;
            width: 90%;
            animation: floatIn 1s ease-out;
            border: 3px solid var(--schatten-leicht);
            position: relative;
            z-index: 10;
            margin: auto;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 18px;
                border-radius: 28px;
            }
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(-50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        #mainText {
            font-size: 2.8em;
            color: var(--text-farbe);
            margin-bottom: 50px;
            font-weight: bold;
            text-shadow: 3px 3px 6px var(--schatten-leicht);
            animation: pulse 2s ease-in-out infinite;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            #mainText {
                font-size: clamp(1.4em, 7vw, 2em);
                margin-bottom: 20px;
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            min-height: 200px;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .buttons {
                min-height: 300px;
                flex-direction: column;
                justify-content: flex-start;
                padding: 10px;
            }
        }

        button {
            font-family: 'Comic Neue', 'Comic Sans MS', 'Comic Sans', sans-serif;
            font-size: 1.4em;
            padding: 20px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            position: relative;
            touch-action: manipulation;          /* kein Doppeltipp-Zoom auf dem Handy */
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 768px) {
            button {
                font-size: 1.1em;
                padding: 14px 24px;
            }
        }

        #yesBtn {
            background: linear-gradient(135deg, var(--ja-hell), var(--ja-dunkel));
            color: white;
            position: relative;
            z-index: 5;
        }

        #yesBtn:hover {
            transform: translateY(-8px) scale(1.1);
            box-shadow: 0 15px 40px var(--schatten);
        }

        #noBtn {
            background: linear-gradient(135deg, var(--nein-hell), var(--nein-dunkel));
            color: #fff;
            position: absolute;
            transition: all 0.15s ease-out;
            z-index: 10;
            width: max-content;
            max-width: calc(100% - 20px);
        }

        #noBtn:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: translateY(-2px) scale(1.02);
        }

        #emojiContainer {
            font-size: 3.5em;
            margin-top: 30px;
            animation: bounce 1s ease infinite;
            letter-spacing: 10px;
        }

        @media (max-width: 768px) {
            #emojiContainer {
                font-size: 2.5em;
                letter-spacing: 5px;
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        .hidden {
            display: none;
        }

        .heart {
            position: fixed;
            font-size: 2.5em;
            animation: floatUp 4s ease-in-out;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-1000px) rotate(360deg); }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            75% { transform: translateX(10px) rotate(5deg); }
        }

        #clickCount {
            margin-top: 20px;
            font-size: 1.1em;
            color: var(--text-farbe);
            font-weight: bold;
            min-height: 30px;
        }

        @media (max-width: 768px) {
            #clickCount { font-size: 1em; }
        }

        .sparkle {
            position: fixed;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkleAnim 1s ease-out forwards;
            z-index: 999;
        }

        @keyframes sparkleAnim {
            0% { opacity: 1; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }
    </style>
</head>
<body>
    <!-- Schwebende Herzen im Hintergrund -->
    <div class="bg-heart" style="top: 10%; left: 10%; animation-delay: 0s;">❤️</div>
    <div class="bg-heart" style="top: 70%; left: 80%; animation-delay: 2s;">💖</div>
    <div class="bg-heart" style="top: 30%; left: 85%; animation-delay: 4s;">💕</div>
    <div class="bg-heart" style="top: 60%; left: 15%; animation-delay: 6s;">💗</div>
    <div class="bg-heart" style="top: 20%; left: 50%; animation-delay: 8s;">💝</div>

    <div class="container">
        <div id="mainText"></div>
        <div class="buttons">
            <button id="yesBtn"></button>
            <button id="noBtn"></button>
        </div>
        <div id="clickCount"></div>
        <div id="emojiContainer" class="hidden"></div>
    </div>

    <script>
        /* =====================================================================
           ✏️  HIER DEINE TEXTE EINTRAGEN  ✏️
           Nur diesen Block anpassen – der Rest der Seite bleibt, wie er ist.
           - Texte immer zwischen die Anführungszeichen "..." schreiben
           - <br> erzeugt einen Zeilenumbruch
           - Wenn du selbst ein " im Text brauchst, schreibe \"
           ===================================================================== */
        const TEXTE = {

            // Button zum Verzeihen (JA)
            jaButton: "Okii, ich verzeihe dir 💕",

            // Button, der wegläuft (NEIN)
            neinButton: "Nein, ich bin noch sauer 😠",

            // Nachrichten, die nacheinander erscheinen, wenn man auf NEIN will.
            // Die ERSTE Nachricht ist gleichzeitig die Startnachricht.
            // Du kannst beliebig viele Zeilen hinzufügen oder löschen.
            entschuldigungen: [
                "Es tut mir wirklich leid Angie ❤️<br>Bitte verzeih mir 🥺",
                "Ich verspreche, an mir zu arbeiten 😢💕",
                "Du bist mir super wichtig 🌍💖",
                "Ich kann an nichts anderes denken 😭",
                "Bitte gib mir noch eine Chance 🙏️",
                "Ich mache alles, um es wiedergutzumachen 😃",
                "Ich hab Mist gebaut, aber ich hab dich gern 💕😔",
                "Ohne dein Lächeln ist alles nicht dasselbe 😢",
                "Ich verspreche, mich zu bessern 🌟💝️",
                "Verzeihst du mir? Ich lade dich auf ein Eis ein 🍦💕",
                "Es tut mir so so so leid 😭️",
                "Du verdienst die Welt 🌹",
                "Bitte bitte mit Sahne obendrauf? 🍒🥺",
                "Ich werde dich nie wieder enttäuschen, versprochen️!"
            ],

            // Text unter den Buttons, je nach Anzahl der NEIN-Versuche
            // (Die Zahl der Versuche wird automatisch dahinter angehängt)
            versuche1bis5:  "Komm schon... klick einfach auf JA! 🥺",
            versuche6bis10: "Bitte! Ich flehe dich an! 😭",
            versucheAb11:   "Das kann ich den ganzen Tag machen! 💪❤️",
            wortVersuche:   "Versuche",

            // Was erscheint, wenn auf JA geklickt wurde
            erfolgUeberschrift: "Juhu! Du hast mir verziehen! 😀💖🥳",
            erfolgEmojis:       "😊️💃🎉✨💕🌟🎊💖🌹😘",
            erfolgUntertext:    "ICH HAB DICH SO GERN! ❤️"
        };
        /* ======================= ENDE DER TEXTE ============================= */


        const mainText = document.getElementById('mainText');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const emojiContainer = document.getElementById('emojiContainer');
        const clickCount = document.getElementById('clickCount');
        const buttonsContainer = document.querySelector('.buttons');

        const sorryMessages = TEXTE.entschuldigungen;

        // Starttexte setzen
        mainText.innerHTML = sorryMessages[0];
        yesBtn.innerHTML = TEXTE.jaButton;
        noBtn.innerHTML = TEXTE.neinButton;

        let currentMessageIndex = 0;
        let noClickCount = 0;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
            || window.matchMedia('(hover: none)').matches;

        function createSparkle(x, y) {
            for (let i = 0; i < 5; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = x + (Math.random() - 0.5) * 50 + 'px';
                sparkle.style.top = y + (Math.random() - 0.5) * 50 + 'px';
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 1000);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = ['❤️', '💖', '💕', '💗', '💝', '🥰', '😍'][Math.floor(Math.random() * 7)];
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = window.innerHeight + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        function moveNoButton() {
            const rect = buttonsContainer.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            const yesRect = yesBtn.getBoundingClientRect();

            // NEIN-Button wird bei jedem Versuch kleiner
            noClickCount++;
            const newScale = Math.max(0.3, 1 - (noClickCount * 0.1));

            // Sichtbare Größe nach dem Verkleinern (damit er nie aus dem Rahmen rutscht)
            const w = noBtn.offsetWidth, h = noBtn.offsetHeight;
            const visW = w * newScale, visH = h * newScale;
            const maxX = Math.max(0, rect.width - visW - 20);
            const maxY = Math.max(0, rect.height - visH - 20);

            let newX, newY;
            let attempts = 0;
            const maxAttempts = 50;

            // Neue Position suchen, die den JA-Button nicht überdeckt
            do {
                newX = Math.random() * maxX + 10;
                newY = Math.random() * maxY + 10;
                attempts++;

                const noLeft = rect.left + newX;
                const noRight = noLeft + visW;
                const noTop = rect.top + newY;
                const noBottom = noTop + visH;

                const padding = 30;

                const overlaps = !(
                    noRight + padding < yesRect.left ||
                    noLeft - padding > yesRect.right ||
                    noBottom + padding < yesRect.top ||
                    noTop - padding > yesRect.bottom
                );

                if (!overlaps || attempts >= maxAttempts) {
                    break;
                }
            } while (true);

            // Umrechnen: sichtbare Position -> CSS-Position (Verkleinerung geht von der Mitte aus)
            noBtn.style.left = (newX - (w - visW) / 2) + 'px';
            noBtn.style.top = (newY - (h - visH) / 2) + 'px';
            noBtn.style.transform = `scale(${newScale})`;

            createSparkle(btnRect.left + btnRect.width / 2, btnRect.top + btnRect.height / 2);
        }

        function initNoButton() {
            noClickCount = 0;
            noBtn.style.transform = 'scale(1)';
            yesBtn.style.marginRight = '0px';
            yesBtn.style.marginBottom = '0px';

            const isMobileView = window.innerWidth <= 768;
            const gap = 25;
            const cw = buttonsContainer.clientWidth;
            const ch = buttonsContainer.clientHeight;
            const nw = noBtn.offsetWidth, nh = noBtn.offsetHeight;

            if (isMobileView) {
                // Handy: NEIN mittig unterhalb von JA
                noBtn.style.left = ((cw - nw) / 2) + 'px';
                noBtn.style.top = (ch * 0.72 - nh / 2) + 'px';
            } else if (yesBtn.offsetWidth + gap + nw <= cw - 40) {
                // Laptop: beide Buttons nebeneinander, zusammen mittig
                yesBtn.style.marginRight = (nw + gap) + 'px';
                noBtn.style.left = (yesBtn.offsetLeft + yesBtn.offsetWidth + gap) + 'px';
                noBtn.style.top = (yesBtn.offsetTop + (yesBtn.offsetHeight - nh) / 2) + 'px';
            } else {
                // Schmales Fenster: untereinander
                yesBtn.style.marginBottom = (nh + gap) + 'px';
                noBtn.style.left = ((cw - nw) / 2) + 'px';
                noBtn.style.top = (yesBtn.offsetTop + yesBtn.offsetHeight + gap) + 'px';
            }
        }

        function onNoAttempt() {
            moveNoButton();

            // Nächste Nachricht anzeigen
            currentMessageIndex = (currentMessageIndex + 1) % sorryMessages.length;
            mainText.innerHTML = sorryMessages[currentMessageIndex];
            mainText.classList.add('shake');
            setTimeout(() => mainText.classList.remove('shake'), 500);

            let hinweis;
            if (noClickCount <= 5) {
                hinweis = TEXTE.versuche1bis5;
            } else if (noClickCount <= 10) {
                hinweis = TEXTE.versuche6bis10;
            } else {
                hinweis = TEXTE.versucheAb11;
            }
            clickCount.innerHTML = `${hinweis} (${TEXTE.wortVersuche}: ${noClickCount})`;

            createHeart();
        }

        initNoButton();
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => { if (noClickCount === 0) initNoButton(); });
        }
        let lastWidth = window.innerWidth;
        window.addEventListener('resize', () => {
            if (window.innerWidth !== lastWidth) {
                lastWidth = window.innerWidth;
                initNoButton();
            }
        });

        // Desktop: Button weicht beim Drüberfahren mit der Maus aus
        if (!isMobile) {
            noBtn.addEventListener('mouseenter', onNoAttempt);
        }

        // Handy (und Desktop-Klick): Button springt beim Antippen weg
        noBtn.addEventListener('click', function (e) {
            e.preventDefault();
            onNoAttempt();
        });

        // Klick auf JA
        yesBtn.addEventListener('click', function () {
            mainText.innerHTML = TEXTE.erfolgUeberschrift;
            emojiContainer.innerHTML = TEXTE.erfolgEmojis;
            emojiContainer.classList.remove('hidden');
            clickCount.innerHTML = TEXTE.erfolgUntertext;
            buttonsContainer.style.display = 'none';

            for (let i = 0; i < 30; i++) {
                setTimeout(() => createHeart(), i * 150);
            }

            document.body.style.background = 'linear-gradient(-45deg, var(--hintergrund-3), var(--hintergrund-4), var(--hintergrund-3), #d0ebff, var(--hintergrund-3), var(--hintergrund-4))';
        });

        // JA-Button wird mit jedem NEIN-Versuch größer
        setInterval(() => {
            if (noClickCount > 3 && buttonsContainer.style.display !== 'none') {
                const maxScale = (window.innerWidth * 0.95) / yesBtn.offsetWidth;
                const scale = Math.min(1.1 + (noClickCount * 0.05), maxScale);
                yesBtn.style.transform = `translateY(-8px) scale(${scale})`;
            }
        }, 100);
    </script>
</body>
</html>
